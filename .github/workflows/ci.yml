name: Continuous Integration

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, ready_for_review, review_requested]

jobs:
  # Determine which tests to run based on changed files
  detect-changes:
    name: Detect Changes
    runs-on: ubicloud-standard-2
    outputs:
      python-changed: ${{ steps.changes.outputs.python }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      force-run: ${{ steps.changes.outputs.force-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for Git operations

      - name: Check for FORCE_RUN_PRESUBMIT in PR description
        id: force-check
        run: |
          if [[ "${{ github.event.pull_request.body }}" == *"FORCE_RUN_PRESUBMIT"* ]]; then
            echo "force-run=true" >> $GITHUB_OUTPUT
            echo "🚨 FORCE_RUN_PRESUBMIT detected in PR description - will run all tests"
          else
            echo "force-run=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed files
        id: changes
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check for CI/workflow changes (affects both Python and frontend)
          if echo "$CHANGED_FILES" | grep -E '^\.github/' > /dev/null; then
            echo "python-changed=true" >> $GITHUB_OUTPUT
            echo "frontend-changed=true" >> $GITHUB_OUTPUT
            echo "🔧 GitHub Actions workflows changed - running all tests"
          else
            # Check for Python-related changes
            if echo "$CHANGED_FILES" | grep -E '^(services/|pyproject\.toml|noxfile\.py|uv\.lock|scripts/)' > /dev/null; then
              echo "python-changed=true" >> $GITHUB_OUTPUT
              echo "🐍 Python-related files changed"
            else
              echo "python-changed=false" >> $GITHUB_OUTPUT
              echo "🐍 No Python-related files changed"
            fi
            
            # Check for frontend-related changes
            if echo "$CHANGED_FILES" | grep -E '^(frontend/|gateway/|Dockerfile\.frontend|docker-compose\.yml)' > /dev/null; then
              echo "frontend-changed=true" >> $GITHUB_OUTPUT
              echo "⚛️ Frontend-related files changed"
            else
              echo "frontend-changed=false" >> $GITHUB_OUTPUT
              echo "⚛️ No frontend-related files changed"
            fi
          fi

          # Override with force-run if detected
          if [[ "${{ steps.force-check.outputs.force-run }}" == "true" ]]; then
            echo "python-changed=true" >> $GITHUB_OUTPUT
            echo "frontend-changed=true" >> $GITHUB_OUTPUT
            echo "🚨 Force run enabled - all tests will run"
          fi
  check-generated-files:
    name: Check Generated Files Are Up to Date
    if: ${{ github.event_name == 'pull_request' }}
    needs: detect-changes
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for Git operations

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --all-packages --all-extras --active

      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Copy .env file for schema generation
        run: cp .example.env .env

      - name: Generate OpenAPI schemas
        run: |
          ./scripts/generate-api-schema.sh --schema-only

      - name: Clean existing types
        run: |
          cd frontend
          rm -rf types/api
          echo "🧹 Cleaned existing type directories"

      - name: Generate TypeScript types
        run: |
          cd frontend
          npm run generate-types

      - name: Copy .example.env to frontend/.env
        run: cp .example.env frontend/.env

      - name: Build Application
        run: |
          cd frontend
          npm run build

      - name: Check for uncommitted changes
        run: |
          # Check if any generated files have changed
          # Only check OpenAPI schema files and frontend TypeScript types
          GENERATED_FILES=$(git diff --name-only | grep -E '\.(json|ts|tsx)$' | grep -E '(openapi/schema\.json|frontend/types/api)' || true)

          if [[ -n "$GENERATED_FILES" ]]; then
            echo "❌ Generated files are out of date!"
            echo "The following generated files have been modified:"
            echo "$GENERATED_FILES"
            echo ""
            echo "Please run the following commands to update generated files:"
            echo "  ./scripts/generate-api-schema.sh"
            echo "  git add . && git commit -m 'Update generated files'"
            echo ""
            echo "Note: The generate-api-schema.sh script automatically cleans existing types"
            echo "before generation, ensuring a fresh and consistent output."
            echo ""
            echo "This ensures that your PR includes the latest generated types and schemas."
            exit 1
          else
            echo "✅ All generated files are up to date!"
          fi

      - name: Show generated files status
        run: |
          echo "📊 Generated files status:"
          echo "OpenAPI schemas:"
          find services/*/openapi -name "schema.json" 2>/dev/null | wc -l | xargs echo "  - Total schemas:"
          echo "TypeScript types:"
          find frontend/types/api -type d 2>/dev/null | wc -l | xargs echo "  - Total service type directories:"
          echo ""
          echo "📋 Detailed schema status:"

          # Services that should have OpenAPI schemas
          EXCLUDED_SERVICES="common vector_db email_sync demos vespa_loader briefly.egg-info __pycache__ api"
          missing_schemas=()
          total_expected=0
          total_found=0

          for service in services/*/; do
            if [[ -d "$service" ]]; then
              service_name=$(basename "$service")

              # Skip excluded services
              if [[ " $EXCLUDED_SERVICES " =~ " $service_name " ]]; then
                echo "  ⏭️  $service_name: excluded from schema validation"
                continue
              fi

              total_expected=$((total_expected + 1))

              if [[ -f "$service/openapi/schema.json" ]]; then
                echo "  ✅ $service_name: schema.json exists"
                total_found=$((total_found + 1))
              else
                echo "  ❌ $service_name: schema.json missing"
                missing_schemas+=("$service_name")
              fi
            fi
          done

          echo ""
          echo "📊 Schema validation summary:"
          echo "  - Expected schemas: $total_expected"
          echo "  - Found schemas: $total_found"
          echo "  - Missing schemas: ${#missing_schemas[@]}"

          if [[ ${#missing_schemas[@]} -gt 0 ]]; then
            echo ""
            echo "❌ Missing required OpenAPI schemas:"
            printf "  - %s\n" "${missing_schemas[@]}"
            echo ""
            echo "This CI check will fail. Please ensure all required services have OpenAPI schemas generated."
            exit 1
          fi

          echo ""
          echo "✅ All required OpenAPI schemas are present!"

  lint:
    name: Python Linting & Formatting
    needs: detect-changes
    runs-on: ubicloud-standard-2
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Check if Python tests should run
      run: |
        if [[ "${{ needs.detect-changes.outputs.python-changed }}" == "false" ]]; then
          echo "✅ Python linting skipped - no Python-related changes detected"
          echo "SKIP_TESTS=true" >> $GITHUB_ENV
        else
          echo "🐍 Python linting will run - Python-related changes detected"
          echo "SKIP_TESTS=false" >> $GITHUB_ENV
        fi

    - name: Set up Python ${{ matrix.python-version }}
      if: env.SKIP_TESTS == 'false'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache UV dependencies
      if: env.SKIP_TESTS == 'false'
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          ~/.cargo/registry
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install UV
      if: env.SKIP_TESTS == 'false'
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies with UV
      if: env.SKIP_TESTS == 'false'
      run: |
        uv sync --all-packages --all-extras --active

    - name: Run nox (format, lint)
      if: env.SKIP_TESTS == 'false'
      run:  |
        source .venv/bin/activate
        nox -s format lint

    - name: Check for conftest.py files
      if: env.SKIP_TESTS == 'false'
      run: |
        set -euo pipefail
        # Find conftest.py in the repository while excluding tool and virtual environment directories
        mapfile -t conftest_files < <(find . \
          -type d \( -name .venv -o -name .nox -o -name .git -o -name node_modules -o -name dist -o -name build \) -prune \
          -o -type f -name "conftest.py" -print)

        if (( ${#conftest_files[@]} > 0 )); then
          echo "Error: conftest.py files are not allowed. Found the following files:"
          printf '%s\n' "${conftest_files[@]}"
          exit 1
        fi

  typecheck:
    name: Python Type Checking
    needs: detect-changes
    runs-on: ubicloud-standard-2
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Check if Python tests should run
      run: |
        if [[ "${{ needs.detect-changes.outputs.python-changed }}" == "false" ]]; then
          echo "✅ Python type checking skipped - no Python-related changes detected"
          echo "SKIP_TESTS=true" >> $GITHUB_ENV
        else
          echo "🐍 Python type checking will run - Python-related changes detected"
          echo "SKIP_TESTS=false" >> $GITHUB_ENV
        fi

    - name: Set up Python ${{ matrix.python-version }}
      if: env.SKIP_TESTS == 'false'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache UV dependencies
      if: env.SKIP_TESTS == 'false'
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          ~/.cargo/registry
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install UV
      if: env.SKIP_TESTS == 'false'
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Install dependencies with UV
      if: env.SKIP_TESTS == 'false'
      run: |
        uv sync --all-packages --all-extras --active

    - name: Run nox (typecheck)
      if: env.SKIP_TESTS == 'false'
      run: |
        source .venv/bin/activate
        nox -s typecheck

  test:
    name: Python Tests
    needs: detect-changes
    runs-on: ubicloud-standard-2
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Check if Python tests should run
      run: |
        if [[ "${{ needs.detect-changes.outputs.python-changed }}" == "false" ]]; then
          echo "✅ Python tests skipped - no Python-related changes detected"
          echo "SKIP_TESTS=true" >> $GITHUB_ENV
        else
          echo "🐍 Python tests will run - Python-related changes detected"
          echo "SKIP_TESTS=false" >> $GITHUB_ENV
        fi

    - name: Set up Python ${{ matrix.python-version }}
      if: env.SKIP_TESTS == 'false'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache UV dependencies
      if: env.SKIP_TESTS == 'false'
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          ~/.cargo/registry
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-
    - name: Install UV
      if: env.SKIP_TESTS == 'false'
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Install dependencies with UV
      if: env.SKIP_TESTS == 'false'
      run: |
        uv sync --all-packages --all-extras --active

    - name: Run nox (test)
      if: env.SKIP_TESTS == 'false'
      run: |
        source .venv/bin/activate
        nox -s test

  coverage:
    name: Python Coverage
    needs: detect-changes
    runs-on: ubicloud-standard-2
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Check if Python tests should run
      run: |
        if [[ "${{ needs.detect-changes.outputs.python-changed }}" == "false" ]]; then
          echo "✅ Python coverage skipped - no Python-related changes detected"
          echo "SKIP_TESTS=true" >> $GITHUB_ENV
        else
          echo "🐍 Python coverage will run - Python-related changes detected"
          echo "SKIP_TESTS=false" >> $GITHUB_ENV
        fi

    - name: Set up Python ${{ matrix.python-version }}
      if: env.SKIP_TESTS == 'false'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache UV dependencies
      if: env.SKIP_TESTS == 'false'
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          ~/.cargo/registry
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-
    - name: Install UV
      if: env.SKIP_TESTS == 'false'
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Install dependencies with UV
      if: env.SKIP_TESTS == 'false'
      run: |
        uv sync --all-packages --all-extras --active

    - name: Run nox (coverage)
      if: env.SKIP_TESTS == 'false'
      run: |
        source .venv/bin/activate
        nox -s test_cov

    - name: Upload coverage reports
      if: env.SKIP_TESTS == 'false' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend-quality:
    name: Frontend Code Quality
    needs: detect-changes
    runs-on: ubicloud-standard-2

    steps:
    - uses: actions/checkout@v4

    - name: Check if frontend tests should run
      run: |
        if [[ "${{ needs.detect-changes.outputs.frontend-changed }}" == "false" ]]; then
          echo "✅ Frontend quality checks skipped - no frontend-related changes detected"
          echo "SKIP_TESTS=true" >> $GITHUB_ENV
        else
          echo "⚛️ Frontend quality checks will run - frontend-related changes detected"
          echo "SKIP_TESTS=false" >> $GITHUB_ENV
        fi

    - name: Set up Node.js
      if: env.SKIP_TESTS == 'false'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      if: env.SKIP_TESTS == 'false'
      working-directory: ./frontend
      run: npm ci

    - name: Run ESLint
      if: env.SKIP_TESTS == 'false'
      working-directory: ./frontend
      run: npm run lint

    - name: Type check
      if: env.SKIP_TESTS == 'false'
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Run Jest tests
      if: env.SKIP_TESTS == 'false'
      working-directory: ./frontend
      run: npx jest --ci

    - name: Copy .example.env to frontend/.env
      if: env.SKIP_TESTS == 'false'
      run: cp .example.env frontend/.env

    - name: Set NEXTAUTH_SECRET for CI build
      if: env.SKIP_TESTS == 'false'
      working-directory: ./frontend
      run: echo "NEXTAUTH_SECRET=dummy-secret-for-ci-build-$(date +%s)" >> .env

    - name: Set NEXTAUTH_URL for CI build
      if: env.SKIP_TESTS == 'false'
      working-directory: ./frontend
      run: echo "NEXTAUTH_URL=https://github.com" >> .env

    - name: Build application
      if: env.SKIP_TESTS == 'false'
      working-directory: ./frontend
      run: npm run build

  # Summary job to show what tests were run
  test-summary:
    name: Test Summary
    needs: [detect-changes, lint, typecheck, test, coverage, frontend-quality]
    if: always()
    runs-on: ubicloud-standard-2
    steps:
      - name: Show test summary
        run: |
          echo "## 🧪 CI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.detect-changes.outputs.force-run }}" == "true" ]]; then
            echo "🚨 **FORCE_RUN_PRESUBMIT** was detected in the PR description" >> $GITHUB_STEP_SUMMARY
            echo "All tests were run regardless of file changes." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Tests Run:" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.detect-changes.outputs.python-changed }}" == "true" ]]; then
            echo "✅ **Python Tests** - Run because Python-related files changed" >> $GITHUB_STEP_SUMMARY
            echo "- Linting & Formatting: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Type Checking: ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Unit Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Coverage: ${{ needs.coverage.result }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Python Tests** - Skipped (no Python-related changes)" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.detect-changes.outputs.frontend-changed }}" == "true" ]]; then
            echo "✅ **Frontend Tests** - Run because frontend-related files changed" >> $GITHUB_STEP_SUMMARY
            echo "- Code Quality: ${{ needs.frontend-quality.result }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Frontend Tests** - Skipped (no frontend-related changes)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files that trigger tests:" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: \`services/\`, \`pyproject.toml\`, \`noxfile.py\`, \`uv.lock\`, \`scripts/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: \`frontend/\`, \`gateway/\`, \`Dockerfile.frontend\`, \`docker-compose.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Both**: \`.github/\` (GitHub Actions workflows)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To force all tests to run, add \`FORCE_RUN_PRESUBMIT\` to your PR description." >> $GITHUB_STEP_SUMMARY
